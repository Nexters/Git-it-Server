name: Backend CD

on:
  push:
    branches:
      - main
  # main 밖에서 이미지 빌드만 미리 확인할 수 있게 열어 둔다. 배포는 따라오지 않는다.
  workflow_dispatch:

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: action checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Jib이 GHCR에 직접 인증하므로 docker login 단계가 없다.
      - name: Build and push image
        env:
          JIB_TO_USERNAME: ${{ github.actor }}
          JIB_TO_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # latest는 운영 서버가 pull하는 태그라 main에서만 옮긴다. 브랜치 수동 실행은 sha 태그만 남긴다.
        run: ./gradlew jib -Djib.to.tags=${{ github.sha }}${{ github.ref == 'refs/heads/main' && ',latest' || '' }}

  deploy:
    needs: build-and-push
    # 브랜치에서 수동 실행했을 때 그 빌드가 운영에 나가지 않게 막는다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: action checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USERNAME }}
          key: ${{ secrets.API_SERVER_KEY }}
          port: ${{ secrets.API_SERVER_PORT }}
          source: "docker-compose.prod.yml"
          target: "~/git-it"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USERNAME }}
          key: ${{ secrets.API_SERVER_KEY }}
          port: ${{ secrets.API_SERVER_PORT }}
          script_stop: true
          script: |
            cd ~/git-it
            umask 077
            cat > .env <<'ENVEOF'
            ${{ secrets.PROD_ENV_FILE }}
            ENVEOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
