name: Backend CD

on:
  push:
    branches:
      - main
  # 브랜치를 골라 파이프라인 전 구간을 그대로 돌려볼 수 있게 열어 둔다.
  # 실행한 브랜치의 코드가 그대로 운영에 뜬다 — 되돌리려면 main을 다시 배포해야 한다.
  workflow_dispatch:

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: action checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Jib은 자격 증명을 환경변수로 받지 않는다. 여기서 만든 ~/.docker/config.json을 읽어 간다.
      # -Djib.to.auth.password로도 되지만 토큰이 프로세스 인자에 노출된다.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: ./gradlew jib -Djib.to.tags=${{ github.sha }},latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-22.04
    steps:
      - name: action checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USERNAME }}
          key: ${{ secrets.API_SERVER_KEY }}
          port: ${{ secrets.API_SERVER_PORT }}
          source: "docker-compose.prod.yml"
          target: "~/git-it"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USERNAME }}
          key: ${{ secrets.API_SERVER_KEY }}
          port: ${{ secrets.API_SERVER_PORT }}
          script_stop: true
          script: |
            cd ~/git-it
            umask 077
            cat > .env <<'ENVEOF'
            ${{ secrets.PROD_ENV_FILE }}
            ENVEOF
            chmod 600 .env
            # 배포 계정이 docker 그룹에 없어 sudo가 필요하다. 비대화형 셸에는 docker가 PATH에도
            # 없는데, sudo가 secure_path로 찾아주므로 그 문제까지 함께 해결된다.
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sudo docker image prune -f
