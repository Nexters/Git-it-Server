name: Backend CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: action checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Jib이 GHCR에 직접 인증하므로 docker login 단계가 없다.
      - name: Build and push image
        env:
          JIB_TO_USERNAME: ${{ github.actor }}
          JIB_TO_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew jib -Djib.to.tags=${{ github.sha }},latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-22.04
    steps:
      - name: action checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USERNAME }}
          key: ${{ secrets.API_SERVER_KEY }}
          port: ${{ secrets.API_SERVER_PORT }}
          source: "docker-compose.prod.yml"
          target: "~/git-it"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.API_SERVER_HOST }}
          username: ${{ secrets.API_SERVER_USERNAME }}
          key: ${{ secrets.API_SERVER_KEY }}
          port: ${{ secrets.API_SERVER_PORT }}
          script_stop: true
          script: |
            cd ~/git-it
            umask 077
            cat > .env <<'ENVEOF'
            ${{ secrets.PROD_ENV_FILE }}
            ENVEOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
