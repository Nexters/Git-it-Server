spring:
  application:
    name: git-it
  # 문제 생성 스케줄러를 끈다. 켜 두면 테스트가 만든 READY 저장소를 폴링이 집어 GitHub·Gemini를 실제로 부른다.
  profiles:
    active: test
  data:
    mongodb:
      auto-index-creation: true
  ai:
    google:
      genai:
        # 컨텍스트를 띄우는 데만 필요한 가짜 키. 실제 콜은 @Tag("network") 테스트에서만 나간다.
        api-key: test-google-api-key

ai:
  model:
    concept: gemini-2.5-flash
    anchor: gemini-2.5-flash-lite
    question: gemini-2.5-flash

jwt:
  secret: test-secret-key-for-hs256-must-be-at-least-32-bytes
  access_token:
    expiration_days: 30
  refresh_token:
    expiration_days: 90

oauth:
  google:
    client-id: test-google-client-id
  apple:
    client-id: test-apple-client-id

github:
  work-dir: /tmp/gitit-test-work
