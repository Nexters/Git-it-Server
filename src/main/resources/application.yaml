server:
  # Nginx가 HTTPS를 종료하고 X-Forwarded-* 헤더로 전달하므로, 그 헤더를 신뢰해 스킴/호스트를 올바르게 인식하게 한다.
  # 없으면 Swagger UI가 https 페이지에서 http:// API를 호출해 mixed content로 막힌다.
  forward-headers-strategy: framework

spring:
  application:
    name: git-it
  mongodb:
    host: ${MONGODB_HOST:localhost}
    port: ${MONGODB_PORT:27017}
    database: ${MONGODB_DATABASE:gitit}
    username: ${MONGODB_USERNAME:gitit}
    password: ${MONGODB_PASSWORD:gitit1234}
    authentication-database: admin
  data:
    mongodb:
      auto-index-creation: true

gcp:
  project-id: git-it-503911
  location: us-central1
  credentials-base64: ${GCP_CREDENTIALS_BASE64}

ai:
  model:
    concept: gemini-2.5-flash
    anchor: gemini-2.5-flash-lite
    question: gemini-2.5-pro

springdoc:
  swagger-ui:
    # Authorize 버튼에 넣은 토큰을 새로고침 후에도 유지한다.
    persist-authorization: true

jwt:
  secret: ${JWT_SECRET}
  access_token:
    expiration_days: 30 # 1달
  refresh_token:
    expiration_days: 90 # 3달

oauth:
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID}
  apple:
    client-id: ${OAUTH_APPLE_CLIENT_ID}
