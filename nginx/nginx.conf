events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # 앱 포트는 127.0.0.1에만 바인딩돼 있어 host-gateway 경유로는 닿지 않는다.
    # 같은 compose 네트워크에 있으므로 서비스명으로 간다.
    upstream git-it-api {
        server app:8080;
    }

    server {
        listen 80;
        server_name git-it.kr;

        # 갱신할 때 Certbot이 여기에 토큰 파일을 놓는다. 리다이렉트보다 먼저 와야 한다.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name git-it.kr;

        ssl_certificate     /etc/letsencrypt/live/git-it.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/git-it.kr/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://git-it-api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
