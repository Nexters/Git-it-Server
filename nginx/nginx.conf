events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name git-it.kr;

        # 갱신할 때 Certbot이 여기에 토큰 파일을 놓는다. 리다이렉트보다 먼저 와야 한다.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name git-it.kr;

        ssl_certificate     /etc/letsencrypt/live/git-it.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/git-it.kr/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            # 앱 포트는 127.0.0.1에만 바인딩돼 있어 host-gateway로는 닿지 않는다. 같은 compose
            # 네트워크이므로 서비스명으로 간다.
            #
            # upstream 블록 대신 Docker 내장 DNS + 변수를 쓴다. upstream은 호스트명을 기동
            # 시점에 해석하고, 못 찾으면 [emerg]로 죽는다. 앱이 잠깐 내려간 사이에 nginx가
            # 재시작되면 80·443이 통째로 닫힌다. 변수로 넘기면 요청이 올 때 해석하므로
            # 앱이 없어도 nginx는 살아서 502만 돌려준다.
            resolver 127.0.0.11 valid=10s;
            set $backend "app:8080";
            proxy_pass http://$backend$request_uri;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
