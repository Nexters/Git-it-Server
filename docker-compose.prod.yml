services:
  app:
    image: ghcr.io/nexters/git-it-server:latest
    container_name: git-it-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8
    container_name: git-it-mongodb
    restart: unless-stopped
    # MONGO_INITDB_ROOT_*는 mongodb-data 볼륨이 처음 생성될 때만 적용된다.
    # PROD_ENV_FILE에서 비밀번호를 바꿔도 기존 볼륨의 계정은 그대로 남으므로,
    # 비밀번호를 바꾸려면 mongosh로 직접 계정을 갱신해야 한다.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:?MONGODB_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?MONGODB_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    container_name: git-it-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    # 갱신된 인증서는 reload해야 반영된다. 6시간마다면 만료 전에 반드시 한 번은 걸린다.
    #
    # nginx가 포그라운드여야 한다. 반대로 두면(nginx & + while 루프) nginx가 죽어도 PID 1인
    # sh가 살아남아, 포트를 아무도 듣지 않는데 컨테이너는 Running으로 남고 재시작도 안 된다.
    command: /bin/sh -c "while :; do sleep 6h; nginx -s reload; done & nginx -g 'daemon off;'"

  # 인증서 파일은 named volume이 아니라 호스트 경로에 둔다. 최초 발급은 compose 밖에서
  # docker run으로 도는데, named volume이면 compose가 프로젝트명을 앞에 붙여
  # (git-it_certbot-conf) 양쪽이 서로 다른 볼륨을 보게 된다.
  certbot:
    image: certbot/certbot:latest
    container_name: git-it-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

volumes:
  mongodb-data:
